<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站舆情分析工具</title>
    <style>
        /* 所有样式内联在此，无需外部CSS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body { background-color: #f0f2f5; color: #333; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        header { text-align: center; padding: 30px; background: linear-gradient(135deg, #00a1d6, #0084b8); color: white; border-radius: 15px; margin-bottom: 30px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.1rem; opacity: 0.9; }
        .main { display: flex; flex-wrap: wrap; gap: 25px; margin-bottom: 30px; }
        .card { flex: 1; min-width: 300px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card-title { color: #00a1d6; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; font-size: 1.4rem; }
        input, select, button { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        button { background: #00a1d6; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #0084b8; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .stat-box { background: #f8fafc; padding: 20px; text-align: center; border-radius: 8px; border-left: 5px solid #00a1d6; }
        .stat-value { font-size: 2.2rem; font-weight: bold; color: #00a1d6; }
        .positive { color: #52c41a; }
        .negative { color: #f5222d; }
        footer { text-align: center; padding: 20px; color: #666; margin-top: 30px; }
        #loading, #result { display: none; text-align: center; padding: 20px; }
        #loading p { color: #00a1d6; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 B站舆情分析工具</h1>
            <p class="subtitle">GitHub Pages 部署成功版 | 基于模拟数据的完整演示</p>
        </header>
        
        <div class="main">
            <div class="card">
                <h2 class="card-title">🔍 输入视频信息</h2>
                <p>请输入B站视频的BV号进行分析（演示版使用模拟数据）：</p>
                <input type="text" id="bvidInput" placeholder="例如：BV1GJ411x7h7" value="BV1GJ411x7h7">
                <select id="typeSelect">
                    <option value="both">同时分析评论和弹幕</option>
                    <option value="comment">仅分析评论</option>
                    <option value="danmaku">仅分析弹幕</option>
                </select>
                <button id="analyzeBtn">🚀 开始分析</button>
                <div id="loading">
                    <p>⏳ 正在模拟数据分析过程，请稍候...</p>
                </div>
            </div>
            
            <div class="card">
                <h2 class="card-title">📈 分析结果</h2>
                <div id="result">
                    <div class="stats">
                        <div class="stat-box">
                            <h3>评论总数</h3>
                            <div class="stat-value" id="totalComment">0</div>
                        </div>
                        <div class="stat-box">
                            <h3>弹幕总数</h3>
                            <div class="stat-value" id="totalDanmaku">0</div>
                        </div>
                        <div class="stat-box">
                            <h3>积极情绪</h3>
                            <div class="stat-value positive" id="positiveRate">0%</div>
                        </div>
                        <div class="stat-box">
                            <h3>消极情绪</h3>
                            <div class="stat-value negative" id="negativeRate">0%</div>
                        </div>
                    </div>
                    <div id="report" style="margin-top: 25px; padding: 20px; background: #f9f9f9; border-radius: 8px;"></div>
                </div>
                <p id="placeholder">分析结果将在此处显示。</p>
            </div>
        </div>
        
        <footer>
            <p>✅ 此页面为独立静态页，无任何外部依赖，可在 GitHub Pages 稳定运行。</p>
            <p>你的专属地址：<strong>https://padawan-hudson.github.io/anlasis/</strong></p>
        </footer>
    </div>

    <script>
        // 所有JavaScript内联在此，无需外部JS
        document.getElementById('analyzeBtn').addEventListener('click', function() {
            const bvid = document.getElementById('bvidInput').value.trim();
            if (!bvid) {
                alert('请输入视频BV号');
                return;
            }
            
            // 显示加载
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('placeholder').style.display = 'none';
            
            // 模拟分析延迟
            setTimeout(function() {
                // 生成模拟数据
                const mock = {
                    comment: Math.floor(Math.random() * 2000) + 800,
                    danmaku: Math.floor(Math.random() * 4000) + 1500,
                    positive: Math.floor(Math.random() * 35) + 55,
                    negative: Math.floor(Math.random() * 15) + 5
                };
                
                // 更新DOM
                document.getElementById('totalComment').textContent = mock.comment.toLocaleString();
                document.getElementById('totalDanmaku').textContent = mock.danmaku.toLocaleString();
                document.getElementById('positiveRate').textContent = mock.positive + '%';
                document.getElementById('negativeRate').textContent = mock.negative + '%';
                
                document.getElementById('report').innerHTML = `
                    <h3>📄 模拟分析报告</h3>
                    <p><strong>分析对象：</strong> ${bvid}</p>
                    <p><strong>分析时间：</strong> ${new Date().toLocaleString('zh-CN')}</p>
                    <p><strong>核心结论：</strong> 观众情绪倾向<span style="color:#52c41a; font-weight:bold;">积极</span>，正面反馈为主。</p>
                    <p><em>（这是一个功能完整的演示，使用模拟数据验证页面交互。）</em></p>
                `;
                
                // 显示结果
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                
            }, 1800);
        });
    </script>
</body>
</html>
